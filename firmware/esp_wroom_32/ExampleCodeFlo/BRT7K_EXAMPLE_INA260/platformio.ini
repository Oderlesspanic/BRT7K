; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = upesy_wroom

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
board_microros_transport = serial
build_flags =
	-L$PROJECT_LIBDEPS_DIR/$PIOENV/micro_ros_arduino/src/esp32
	-lmicroros
lib_deps = adafruit/Adafruit INA260 Library@^1.5.3
	mirs240x/micro_ros_arduino@^2.0.7-humble
monitor_speed = 115200
build_src_filter = +<*> -<mainWoRos.cpp>

[env:upesy_wroom_no_ros]
platform = espressif32
board = upesy_wroom
framework = arduino
lib_deps = adafruit/Adafruit INA260 Library@^1.5.3
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
