frontier_explorer_node:
  ros__parameters:
    map_topic: "/map"
    action_name: "navigate_to_pose"
    explore_period: 2.0
    auto_finish_enabled: true

    # Anzahl aufeinanderfolgender Explorer-Zyklen ohne Frontier,
    # bevor Map Saver, Mapping-Stop und Navigation-Start ausgelöst werden.
    no_frontier_finish_count: 5
    completion_coverage_ratio: 0.99
    completion_hold_time: 15.0

    finish_mapping_service: "/task_manager/finish_mapping"
