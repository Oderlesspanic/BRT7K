hardware_supervisor:
  ros__parameters:

    hardware_id: "mobile_robot"
    update_rate_hz: 2.0

    device_names:
      - esp32_drive
      - esp32_gripper
      - esp32_monitor
      - lidar
      - camera_csi
      - imu
      - magnetometer

    devices:
      esp32_drive:
        physical_type: "usb"
        communication_type: "esp32_heartbeat"
        path: "/dev/serial/by-id/ESP32_DRIVE"
        topic: "/esp32_drive/heartbeat"
        topic_type: "std_msgs/msg/Empty"
        timeout: 2.0

      esp32_gripper:
        physical_type: "usb"
        communication_type: "esp32_heartbeat"
        path: "/dev/serial/by-id/ESP32_GRIPPER"
        topic: "/esp32_gripper/heartbeat"
        topic_type: "std_msgs/msg/Empty"
        timeout: 2.0

      esp32_monitor:
        physical_type: "usb"
        communication_type: "esp32_heartbeat"
        path: "/dev/serial/by-id/ESP32_MONITOR"
        topic: "/esp32_monitor/heartbeat"
        topic_type: "std_msgs/msg/Empty"
        timeout: 2.0

      lidar:
        physical_type: "usb"
        communication_type: "topic"
        path: "/dev/serial/by-id/LIDAR"
        topic: "/scan"
        topic_type: "sensor_msgs/msg/LaserScan"
        timeout: 1.0

      camera_csi:
        physical_type: "none"
        communication_type: "topic"
        topic: "/camera/image_raw"
        topic_type: "sensor_msgs/msg/Image"
        timeout: 1.0

      imu:
        physical_type: "i2c"
        communication_type: "topic"
        i2c_bus: 1
        i2c_address: 104
        topic: "/imu/data"
        topic_type: "sensor_msgs/msg/Imu"
        timeout: 0.5

      magnetometer:
        physical_type: "i2c"
        communication_type: "topic"
        i2c_bus: 1
        i2c_address: 30
        topic: "/mag/data_raw"
        topic_type: "sensor_msgs/msg/MagneticField"
        timeout: 0.5
