imu_filter_madgwick:
  ros__parameters:
    use_mag: true
  
    use_magnetic_field_msg: true

    publish_tf: false
    reverse_tf: false

    fixed_frame: odom
    world_frame: enu

    gain: 0.1
    zeta: 0.1

    remove_gravity_vector: true

    publish_debug_topics: false
    constant_dt: 0.0

    orientation_stddev: 0.2
