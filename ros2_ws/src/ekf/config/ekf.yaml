ekf_filter_node:
  ros__parameters:
    frequency: 3.0
    two_d_mode: true
    publish_acceleration: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]

    # IMU input intentionally disabled for now. Madgwick runs without
    # magnetometer correction, so its yaw can drift and make the robot appear
    # to rotate while stationary. Wheel odometry already provides angular z.
