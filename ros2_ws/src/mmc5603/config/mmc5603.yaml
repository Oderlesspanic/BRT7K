mmc5603_node:
  ros__parameters:
    i2c_bus: "/dev/i2c-1"
    device_address: 48
    frame_id: "mag_link"
    publish_rate: 50.0

    offset_x: 0.0
    offset_y: 0.0
    offset_z: 0.0

    scale_x: 1.0
    scale_y: 1.0
    scale_z: 1.0

    magnetic_field_covariance: [1.0e-8, 0.0, 0.0,
                                0.0, 1.0e-8, 0.0,
                                0.0, 0.0, 1.0e-8]